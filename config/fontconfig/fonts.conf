<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- ============================================================
       Tipografía estilo macOS (SF Pro / SF Mono)
       Sans: SF Pro Text. Mono: SF Mono con respaldo Nerd Font
       para los iconos de la barra, terminal y editores.
       ============================================================ -->

  <!-- Sans-serif del sistema -->
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family></prefer>
  </alias>
  <alias binding="same">
    <family>ui-sans-serif</family>
    <prefer><family>SF Pro Text</family><family>SF Pro</family></prefer>
  </alias>

  <!-- Familias que piden muchas apps: se sustituyen por SF Pro Text -->
  <match target="pattern">
    <test name="family"><string>Helvetica</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Arial</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Liberation Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>DejaVu Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Inter</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Inter Variable</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Adwaita Sans</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>Cantarell</string></test>
    <edit name="family" mode="assign" binding="same"><string>SF Pro Text</string></edit>
  </match>

  <!-- Monoespaciada: SF Mono; JetBrainsMono NF cubre los glifos Nerd -->
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>SF Mono</family><family>JetBrainsMono Nerd Font Mono</family></prefer>
  </alias>

  <!-- Suavizado de texto para pantallas LCD -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
